name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test (e.g. a child process waiting on a pipe) fails fast instead of
    # holding the runner for the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies (eframe / GTK / xcb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      # Windows is the primary target: warnings are errors there. Elsewhere the eframe fallback
      # path of gk-dx11 is compiled, which may carry platform-specific unused-code warnings.
      - name: clippy (deny warnings)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: clippy
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --locked

  icongen:
    name: icon generator builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/icongen
      - run: cargo build --manifest-path packaging/icongen/Cargo.toml
