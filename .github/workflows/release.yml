name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0 (ignored for a dry run)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: build every package from the selected branch as workflow artifacts; publish nothing'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # 'true' only for a dry-run dispatch; empty for tag pushes.
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $ver = ($meta.packages | Where-Object name -eq 'gk-app').version
          if ($env:DRY_RUN -ne 'true' -and "v$ver" -ne $env:TAG) { throw "tag $env:TAG does not match gk-app version $ver" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Install WiX (MSI)
        shell: pwsh
        run: |
          # Pinned; build-release.ps1 adds the UI/Util extensions of the same version.
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # The "## <version>" section, up to the next "## " heading.
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match "^## v?$([regex]::Escape($env:VERSION))(\s|$)" })
          $notes = ''
          if ($start -ge 0) {
            $section = $lines[($start + 1)..($lines.Count - 1)]
            $end = [array]::FindIndex([string[]]$section, [Predicate[string]]{ param($l) $l -match '^## ' })
            if ($end -ge 0) { $section = if ($end -gt 0) { $section[0..($end - 1)] } else { @() } }
            $notes = ($section -join "`n").Trim()
          }
          if (-not $notes) {
            Write-Warning "CHANGELOG.md has no section for $env:VERSION"
            $notes = "GitKwaken $env:VERSION."
          }
          $file = Join-Path $env:RUNNER_TEMP 'notes.md'
          [IO.File]::WriteAllText($file, $notes + "`n", (New-Object Text.UTF8Encoding $false))
          "NOTES_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content $file

      - name: Build zip, installers (Inno + MSI) and update.json
        shell: pwsh
        run: |
          ./packaging/build-release.ps1 `
            -Version $env:VERSION `
            -Repo "${{ github.repository }}" `
            -DownloadBaseUrl "https://github.com/${{ github.repository }}/releases/download/$env:TAG" `
            -Notes ([IO.File]::ReadAllText($env:NOTES_FILE).Trim())
          # The script only warns when ISCC / wix are missing; a release must have both.
          foreach ($f in "dist/GitKwaken-$env:VERSION-x64-setup.exe", "dist/GitKwaken-$env:VERSION-x64.msi") {
            if (-not (Test-Path $f)) { throw "$f was not built" }
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitKwaken-${{ env.VERSION }}-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi
            dist/update.json
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: GitKwaken ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          body_path: ${{ env.NOTES_FILE }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/GitKwaken-${{ env.VERSION }}-x64.zip
            dist/GitKwaken-${{ env.VERSION }}-x64-setup.exe
            dist/GitKwaken-${{ env.VERSION }}-x64.msi
            dist/update.json
            dist/SHA256SUMS.txt

  # Built on the oldest Ubuntu runner so the binary needs only glibc 2.35 and runs on newer
  # distributions (Manjaro / Arch, Fedora, Debian 12+, Ubuntu 22.04+). The tarball and the Arch
  # package below are added to update.json (`linux`) for the self-updater.
  linux:
    name: Linux x86_64 release
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and test dependencies
        run: bash packaging/linux-ci-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Check tag matches Cargo version
        id: version
        run: |
          ver="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "gk-app") | .version')"
          if [ "$DRY_RUN" != true ] && [ "v$ver" != "$TAG" ]; then
            echo "tag $TAG does not match gk-app version $ver" >&2
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build tarball and PKGBUILD
        run: bash packaging/build-linux.sh

      - name: Launch smoke test (binary from the tarball)
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf "dist/GitKwaken-$VERSION-x86_64-linux.tar.gz"
          bash scripts/linux-smoke.sh "$RUNNER_TEMP/unpacked/GitKwaken-$VERSION-x86_64-linux/gitkwaken"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitKwaken-${{ env.VERSION }}-x86_64-linux
          path: |
            dist/GitKwaken-${{ env.VERSION }}-x86_64-linux.tar.gz
            dist/GitKwaken-${{ env.VERSION }}-x86_64-linux.tar.gz.sha256
            dist/PKGBUILD

  # The release's PKGBUILD built into a pacman package on Arch (what `makepkg` does on a
  # desktop) and installed once as a check. pacman installs update themselves with it.
  arch:
    name: Arch package
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.linux.outputs.version }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel

      - uses: actions/download-artifact@v4
        with:
          name: GitKwaken-${{ needs.linux.outputs.version }}-x86_64-linux
          path: dist

      - name: makepkg (as an unprivileged user) and pacman -U
        run: |
          useradd -m builder
          mkdir /home/builder/pkg
          cp dist/PKGBUILD dist/*.tar.gz /home/builder/pkg/
          chown -R builder /home/builder/pkg
          # --nodeps: nothing is compiled; pacman -U pulls the runtime depends.
          su builder -c 'cd ~/pkg && makepkg --nodeps --noconfirm'
          mkdir -p out
          cp /home/builder/pkg/gitkwaken-bin-*.pkg.tar.zst out/
          pacman -U --noconfirm out/gitkwaken-bin-*.pkg.tar.zst
          pacman -Qi gitkwaken-bin
          cd out
          p="$(ls gitkwaken-bin-*.pkg.tar.zst)"
          sha256sum "$p" > "$p.sha256"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: gitkwaken-bin-${{ env.VERSION }}-pkg
          path: out/*

  # Attaches the Linux files to the release the Windows job created (one writer at a time:
  # two jobs creating the same release in parallel race), then adds them to its update.json.
  publish-linux:
    name: Publish Linux assets
    if: ${{ !inputs.dry_run }}
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERSION: ${{ needs.linux.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GitKwaken-${{ needs.linux.outputs.version }}-x86_64-linux
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: gitkwaken-bin-${{ needs.linux.outputs.version }}-pkg
          path: dist

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/GitKwaken-${{ env.VERSION }}-x86_64-linux.tar.gz
            dist/GitKwaken-${{ env.VERSION }}-x86_64-linux.tar.gz.sha256
            dist/PKGBUILD
            dist/gitkwaken-bin-*.pkg.tar.zst
            dist/gitkwaken-bin-*.pkg.tar.zst.sha256

      - name: Add the Linux files to update.json
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          tarball="GitKwaken-$VERSION-x86_64-linux.tar.gz"
          pkg="$(cd dist && ls gitkwaken-bin-*.pkg.tar.zst)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir manifest
          jq --arg tu "$base/$tarball" --arg ts "$(cut -d' ' -f1 "dist/$tarball.sha256")" \
             --arg pu "$base/$pkg" --arg ps "$(cut -d' ' -f1 "dist/$pkg.sha256")" \
             '.linux = {tarball: {url: $tu, sha256: $ts}, pacman: {url: $pu, sha256: $ps}}' \
             manifest/update.json > update.json
          cat update.json
          gh release upload "$TAG" update.json --repo "$GITHUB_REPOSITORY" --clobber
