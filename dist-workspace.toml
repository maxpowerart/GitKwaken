# cargo-dist (https://opensource.axo.dev/cargo-dist/) configuration.
#
#   dist plan                       # what a release would contain
#   dist build --artifacts=local    # build gitkwaken.exe + zip + sha256 into target/distrib
#
# Scope: dist builds the `gitkwaken` binary of `gk-app` for x86_64-pc-windows-msvc and
# packages it as a zip (+ .sha256). The canonical release pipeline is still
# packaging/build-release.ps1 + .github/workflows/release.yml, which produce the zip the
# self-updater consumes (GitKwaken-<ver>-x64.zip + update.json), the Inno Setup installer and
# the MSI. dist's own `msi` installer is not enabled: it is generated by cargo-wix from a
# WiX v3 template (per-machine, Program Files, PATH) and dist does not support WiX v4+,
# while our MSI (packaging/wix/gitkwaken.wxs) is a WiX v6, per-user package that must keep the
# install dir user-writable for the self-updater. See docs/ARCHITECTURE.md "Packaging".
#
# Like any cargo build, the dist-built exe only has a built-in self-update channel when
# GITKWAKEN_UPDATE_CHANNEL is set in the environment (build-release.ps1 sets it).
#
# No `ci` is configured on purpose: dist would generate .github/workflows/release.yml (it
# always uses that name unless `tag-namespace` is set) with a tag-push trigger, which would
# replace or race our release workflow.

[workspace]
members = ["cargo:."]

[dist]
# Pinned; CI/devs install exactly this version (prebuilt binary from the GitHub release).
cargo-dist-version = "0.33.0"
# Only gk-app (binary `gitkwaken`) is distributed: gk-askpass opts out with
# [package.metadata.dist] dist = false, gk-bench is publish = false.
targets = ["x86_64-pc-windows-msvc"]
# Build only `cargo build -p gk-app` (not the whole workspace).
precise-builds = true
# The zip archive is always produced; no extra installers (see header).
installers = []
windows-archive = ".zip"
checksum = "sha256"
# No source tarball (GitHub attaches one to every release anyway).
source-tarball = false
# Ship LICENSE-MIT, LICENSE-APACHE and README.md next to the exe, like build-release.ps1.
auto-includes = true
# msvc-crt-static is left at dist's default (true): the dist-built exe does not need
# VCRUNTIME140.dll.
