[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gix = { version = "0.89", default-features = false, features = ["max-performance-safe", "basic", "status", "dirwalk", "excludes", "attributes", "blame", "mailmap", "sha1", "revparse-regex", "interrupt", "worktree-mutation"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
tracing = "0.1"
bstr = "1"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 16

# Used by cargo-dist (dist-workspace.toml): same settings as `release`.
[profile.dist]
inherits = "release"

[profile.dev.package."*"]
opt-level = 2
