[package]
name = "gk-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GitKwaken: a fast, lightweight git client."

[[bin]]
name = "gitkwaken"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
parking_lot = { workspace = true }
egui = "0.35"
rfd = "0.17"
open = "5"
nucleo-matcher = "0.3"
gk-cli = { path = "../gk-cli" }
gk-core = { path = "../gk-core" }
gk-diff = { path = "../gk-diff" }
gk-graph = { path = "../gk-graph" }
gk-status = { path = "../gk-status" }
gk-settings = { path = "../gk-settings" }
gk-askpass = { path = "../gk-askpass" }
gk-dx11 = { path = "../gk-dx11" }
gk-update = { path = "../gk-update" }
png = "0.18"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tga"] }

[build-dependencies]
winresource = "0.1"

[features]
# Tracy profiling: cargo build --release -p gk-app --features profile
profile = ["gk-core/profile"]
