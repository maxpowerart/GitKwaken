<?xml version="1.0" encoding="UTF-8"?>
<!-- GitKwaken logo: a kraken whose tentacles are git branch lines.
     Palette: #16213E (ink), #2EC4B6 (teal), #FF9F1C (amber). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="#16213E"/>

  <!-- tentacles = branches (drawn first so the head overlaps their roots) -->
  <g fill="none" stroke="#2EC4B6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- main line, straight down -->
    <path d="M128 110 L128 214"/>
    <!-- left branch: forks out and curls -->
    <path d="M108 112 C 96 150, 58 150, 58 188"/>
    <!-- right branch: forks out, then merges back into main -->
    <path d="M148 112 C 160 150, 198 150, 198 178 C 198 196, 150 196, 132 210"/>
  </g>

  <!-- head (mantle) -->
  <path d="M60 112 C 60 52, 92 30, 128 30 C 164 30, 196 52, 196 112 Z" fill="#2EC4B6"/>

  <!-- eyes -->
  <circle cx="104" cy="88" r="13" fill="#16213E"/>
  <circle cx="152" cy="88" r="13" fill="#16213E"/>
  <circle cx="108" cy="84" r="4.5" fill="#FF9F1C"/>
  <circle cx="156" cy="84" r="4.5" fill="#FF9F1C"/>

  <!-- commits on the branches -->
  <g fill="#FF9F1C" stroke="#16213E" stroke-width="7">
    <circle cx="128" cy="150" r="15"/>
    <circle cx="58" cy="190" r="17"/>
    <circle cx="198" cy="166" r="15"/>
    <circle cx="128" cy="212" r="17"/>
  </g>
</svg>
